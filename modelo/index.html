<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROBOHUB — Login</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06121d;
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #06121d;
  }

  /*
    A arte original tem 1536x1024.
    O background-size: contain preserva exatamente a proporção,
    sem cortar ou deformar a imagem.
  */
  .art {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    pointer-events: none;
  }

  /*
    Camada de interação.
    Os elementos são posicionados em porcentagem em relação à arte.
    A aparência inicial permanece transparente para que a imagem
    continue sendo visualmente idêntica à arte original.
  */
  .hotspot {
    position: absolute;
    border: 0;
    background: transparent;
    padding: 0;
  }

  .login-form {
    position: absolute;
    left: 35.5%;
    top: 42.7%;
    width: 29.2%;
    height: 18.0%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field {
    width: 100%;
    height: 58px;
    border: 0;
    outline: none;
    background: transparent;
    color: #f5f8fb;
    font-size: 16px;
    padding: 0 52px;
    border-radius: 14px;
  }

  .field::placeholder { color: transparent; }

  .field:focus {
    /* mantém a estética da arte; não adiciona borda */
    box-shadow: none;
  }

  .password-wrap {
    position: relative;
    width: 100%;
  }

  .toggle-password {
    position: absolute;
    right: 10px;
    top: 0;
    width: 48px;
    height: 58px;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .enter-button {
    position: absolute;
    left: 35.5%;
    top: 57.5%;
    width: 29.2%;
    height: 5.6%;
    border: 0;
    border-radius: 14px;
    background: transparent;
    cursor: pointer;
  }

  .keep-checkbox {
    position: absolute;
    left: 35.5%;
    top: 65.3%;
    width: 24px;
    height: 24px;
    opacity: 0;
    cursor: pointer;
  }

  .forgot {
    position: absolute;
    left: 54.8%;
    top: 65.0%;
    width: 10%;
    height: 3%;
    cursor: pointer;
    border: 0;
    background: transparent;
  }

  .google {
    position: absolute;
    left: 35.5%;
    top: 73.7%;
    width: 29.2%;
    height: 5.1%;
    border: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 14px;
  }

  .institution {
    position: absolute;
    left: 49.5%;
    top: 82.3%;
    width: 13%;
    height: 3%;
    border: 0;
    background: transparent;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: rgba(5, 18, 30, .95);
    color: white;
    border: 1px solid rgba(0,174,239,.7);
    padding: 12px 18px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: .25s ease;
    z-index: 10;
    font-size: 14px;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Em telas menores, mantém a arte inteira e reduz a área útil. */
  @media (max-aspect-ratio: 1/1) {
    .art { width: auto; height: 100%; }
    .login-form {
      left: 35.5%;
      width: 29.2%;
    }
  }
</style>
</head>
<body>
<div class="page">

  <img class="art" src="robohub-login.png" alt="ROBOHUB — Conhecimento em Movimento">

  <form id="loginForm" autocomplete="on">
    <div class="login-form">
      <input
        class="field"
        id="user"
        name="username"
        type="text"
        autocomplete="username"
        aria-label="Usuário ou e-mail"
      >

      <div class="password-wrap">
        <input
          class="field"
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          aria-label="Senha"
        >
        <button class="toggle-password" type="button" id="togglePassword" aria-label="Mostrar senha"></button>
      </div>
    </div>

    <button class="enter-button" type="submit" aria-label="Entrar"></button>

    <input class="keep-checkbox" type="checkbox" id="keep" aria-label="Manter-me conectado">

    <button class="forgot" type="button" id="forgot" aria-label="Esqueci minha senha"></button>

    <button class="google" type="button" id="google" aria-label="Entrar com o Google"></button>

    <button class="institution" type="button" id="institution" aria-label="Fale com sua instituição"></button>
  </form>

  <div class="toast" id="toast"></div>
</div>

<script>
  const toast = document.getElementById("toast");

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
  }

  document.getElementById("togglePassword").addEventListener("click", () => {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
  });

  document.getElementById("loginForm").addEventListener("submit", (event) => {
    event.preventDefault();
    const user = document.getElementById("user").value.trim();
    const password = document.getElementById("password").value;

    if (!user || !password) {
      showToast("Informe seu usuário/e-mail e sua senha.");
      return;
    }

    // Substitua este trecho pela chamada à sua API/autenticação.
    showToast("Login pronto para conectar ao backend do ROBOHUB.");
  });

  document.getElementById("forgot").addEventListener("click", () => {
    showToast("Aqui você poderá conectar o fluxo de recuperação de senha.");
  });

  document.getElementById("google").addEventListener("click", () => {
    showToast("Aqui você poderá integrar o Google OAuth.");
  });

  document.getElementById("institution").addEventListener("click", () => {
    showToast("Aqui você poderá abrir o contato/credenciamento da instituição.");
  });
</script>
</body>
</html>
